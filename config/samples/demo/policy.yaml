# The BackupPolicy used by hack/e2e.sh and hack/demo.sh. The schedule has a past occurrence, so the first run starts at once.
apiVersion: backup.backupvouch.dev/v1alpha1
kind: BackupPolicy
metadata:
  name: app-db
  namespace: default
spec:
  schedule: "0 2 * * *"
  timeZone: UTC
  source:
    engine: postgres
    host: postgres.default.svc
    port: 5432
    database: app
    credentialsSecretRef:
      name: pg-creds
  storage:
    endpoint: s3.default.svc:8333
    bucket: backups
    prefix: app/
    useTLS: false
    credentialsSecretRef:
      name: s3-creds
  retention:
    keepLast: 3
  backupTimeoutSeconds: 300
  verify:
    enabled: true
    timeoutSeconds: 600
    scratchSize: 1Gi
    checks:
      - name: users-not-empty
        sql: "SELECT count(*) > 0 FROM users"
        expect: "true"
      - name: users-count
        sql: "SELECT count(*) FROM users"
        expect: "3"
