apiVersion: backup.backupvouch.pages.dev/v1alpha1
kind: BackupPolicy
metadata:
  labels:
    app.kubernetes.io/name: backupvouch
    app.kubernetes.io/managed-by: kustomize
  name: app-db
spec:
  schedule: "0 2 * * *"
  timeZone: UTC
  suspend: false
  source:
    engine: postgres
    host: postgres.default.svc
    port: 5432
    database: app
    credentialsSecretRef:
      name: pg-creds            # Secret keys: username, password
  storage:
    endpoint: s3.default.svc:8333
    bucket: backups
    prefix: app/
    useTLS: false
    credentialsSecretRef:
      name: s3-creds            # Secret keys: accessKey, secretKey
  retention:
    keepLast: 7
  backupTimeoutSeconds: 1800
  verify:
    enabled: true
    timeoutSeconds: 900
    scratchSize: 5Gi
    checks:
      - name: users-not-empty
        sql: "SELECT count(*) > 0 FROM users"
        expect: "true"
  # runnerImage: ghcr.io/souvik-biswas-dev/backupvouch-runner:v0.1.0   # must be on the operator's allow-list
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
