# Example Secrets for the sample BackupPolicy. NOT part of the kustomization:
# replace the values (or create the Secrets with kubectl) before applying.
apiVersion: v1
kind: Secret
metadata:
  name: pg-creds
type: Opaque
stringData:
  username: backupvouch_ro      # a read-only role
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
type: Opaque
stringData:
  accessKey: change-me
  secretKey: change-me
