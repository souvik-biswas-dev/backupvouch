name: Publish images

# Builds the operator and the runner image and pushes them to ghcr.io (free for public repositories).
# Runs when a tag vX.Y.Z is pushed, or by hand (workflow_dispatch) for a dry run that does not push.
#
# The tag must equal the tag of DefaultRunnerImage in internal/jobs/backup.go, because that is the
# runner image the operator uses by default. Images are linux/amd64 only; add
# docker/setup-qemu-action and `platforms: linux/amd64,linux/arm64` for arm64 (slower, untested).
#
# Images are signed keyless with cosign (the signature is tied to this workflow and repository through
# GitHub's OIDC token) and carry an SBOM and a build provenance attestation. docs/RELEASE.md shows how
# to verify a signature. The cosign installer and the signing step are untested until the first tag.
#
# VERIFY: not run yet. New ghcr.io packages are private by default, make them public once in the
# GitHub package settings. The action versions below were the second-newest releases when this was
# written (pinned by commit SHA like the other workflows); let Dependabot bump them.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the image names
        id: images
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          runner="$(sed -n 's/.*DefaultRunnerImage = "\(.*\)"/\1/p' internal/jobs/backup.go)"
          [ -n "${runner}" ] || { echo "could not read DefaultRunnerImage" >&2; exit 1; }
          tag="${runner##*:}"
          case "${tag}" in latest|"") echo "DefaultRunnerImage must have a pinned tag, got '${runner}'" >&2; exit 1;; esac
          if [ "${REF_TYPE}" = "tag" ] && [ "${REF_NAME}" != "${tag}" ]; then
            echo "git tag ${REF_NAME} does not match the default runner image tag ${tag}" >&2
            exit 1
          fi
          # ghcr.io/<owner>/backupvouch-runner:<tag> -> ghcr.io/<owner>/backupvouch:<tag>
          controller="${runner%-runner:*}:${tag}"
          echo "runner=${runner}" >> "${GITHUB_OUTPUT}"
          echo "controller=${controller}" >> "${GITHUB_OUTPUT}"
          echo "operator image: ${controller}"
          echo "runner image:   ${runner}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator image
        id: operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.images.outputs.controller }}
          sbom: true
          provenance: mode=max

      - name: Build and push the runner image
        id: runner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.images.outputs.runner }}
          sbom: true
          provenance: mode=max

      # Not pinned by SHA because the SHA could not be looked up when this was written; let Dependabot
      # propose the pin after the first run.
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3

      - name: Sign the images (keyless)
        if: github.ref_type == 'tag'
        env:
          CONTROLLER: ${{ steps.images.outputs.controller }}
          RUNNER: ${{ steps.images.outputs.runner }}
          CONTROLLER_DIGEST: ${{ steps.operator.outputs.digest }}
          RUNNER_DIGEST: ${{ steps.runner.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${CONTROLLER_DIGEST}" ] && [ -n "${RUNNER_DIGEST}" ] || { echo "missing image digest" >&2; exit 1; }
          cosign sign --yes "${CONTROLLER%:*}@${CONTROLLER_DIGEST}"
          cosign sign --yes "${RUNNER%:*}@${RUNNER_DIGEST}"
