name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Runs: make manifests generate fmt vet test (unit tests and envtest controller tests).
      - name: Verify
        run: make verify

      # Generated code, CRDs and RBAC, and formatting must be committed, so CI shows no difference.
      - name: Check generated files are committed
        run: git diff --exit-code
