name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: policy
    attributes:
      label: Your BackupPolicy (remove secrets and hostnames you do not want to share)
      render: yaml
    validations: { required: true }
  - type: textarea
    id: status
    attributes:
      label: Output of `kubectl get backuppolicy NAME -o yaml` (status part) and `kubectl describe backuppolicy NAME`
      render: text
  - type: input
    id: versions
    attributes:
      label: BackupVouch version, Kubernetes version, PostgreSQL version
    validations: { required: true }
