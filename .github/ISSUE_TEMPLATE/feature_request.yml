name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation first, then the change you have in mind. See docs/SPEC.md for what is out of scope for now.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
